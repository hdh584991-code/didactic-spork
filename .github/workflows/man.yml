name: build
on: [push, workflow_dispatch]

jobs:
  b:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: 编译并导出
        id: job
        continue-on-error: true
        run: |
          set +e
          mkdir -p s && unzip -o -q Emberkeeper.zip -d s
          R=$(dirname "$(find s -name 'Emberkeeper.csproj' | head -1)")
          echo "R=$R" >> $GITHUB_ENV
          echo "源码根=$R  贴图数=$(find "$R/Emberkeeper/images" -type f | wc -l)"

          # 1) 编译 DLL
          cd "$R"
          dotnet restore -p:UseRefLib=true 2>&1 | tail -3
          dotnet build -c Release --no-restore -p:UseRefLib=true 2>&1 | tail -25
          mkdir -p out/mods/Emberkeeper
          D=$(find . -name "Emberkeeper.dll" -not -path "*/obj/*" | head -1)
          [ -n "$D" ] && cp "$D" out/mods/Emberkeeper/
          cp Emberkeeper.json out/mods/Emberkeeper/

          # 2) 拿 Godot 4.5.1（真实文件名是 linux.x86_64，点分隔）
          mkdir -p /tmp/gd && cd /tmp/gd
          G=""
          for U in \
            "https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip" \
            "https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux_x86_64.zip" ; do
            rm -f g.zip
            curl -sSL --max-time 300 -o g.zip "$U" || continue
            [ "$(stat -c%s g.zip 2>/dev/null || echo 0)" -lt 1000000 ] && continue
            unzip -q -o g.zip || continue
            C=$(find . -maxdepth 1 -type f -iname "Godot*" ! -name "*.zip" | head -1)
            [ -n "$C" ] && chmod +x "$C" && G="$(pwd)/$C" && break
          done
          echo "Godot=$G"
          [ -n "$G" ] && "$G" --headless --version 2>&1 | head -2

          # 3) 导出 PCK（藏起所有 .cs，避免 Godot 尝试编译 C#）
          cd "$R"
          mkdir -p .h
          [ -d Code ] && mv Code .h/Code
          [ -d tools ] && mv tools .h/tools
          [ -f Emberkeeper.csproj ] && mv Emberkeeper.csproj .h/

          OK=0
          if [ -n "$G" ]; then
            "$G" --headless --path . --import 2>&1 | tail -6
            for P in BasicExport CustomExport MinimalExport; do
              echo "--- 预设 $P ---"
              rm -f Emberkeeper.pck
              "$G" --headless --path . --export-pack "$P" Emberkeeper.pck 2>&1 | tail -15
              [ -s Emberkeeper.pck ] && echo "✔ $P 成功" && OK=1 && break
            done
          fi

          [ -d .h/Code ] && mv .h/Code Code
          [ -d .h/tools ] && mv .h/tools tools
          [ -f .h/Emberkeeper.csproj ] && mv .h/Emberkeeper.csproj Emberkeeper.csproj

          # 4) 结果处理
          echo "===== 结果 ====="
          if [ "$OK" = "1" ]; then
            cp Emberkeeper.pck out/mods/Emberkeeper/
            echo "✔ PCK OK → 完整版（自定义贴图）"
          else
            echo "⚠ PCK 失败 → 回退精简版（借用原版美术）"
            sed -i 's/UseCustomArt = true/UseCustomArt = false/' Code/Characters/EmberkeeperCharacter.cs
            dotnet build -c Release --no-restore -p:UseRefLib=true 2>&1 | tail -6
            D2=$(find . -name "Emberkeeper.dll" -not -path "*/obj/*" | head -1)
            [ -n "$D2" ] && cp "$D2" out/mods/Emberkeeper/
            cp Emberkeeper-NoPck.json out/mods/Emberkeeper/Emberkeeper.json
          fi

          # 5) BaseLib 前置库（缺哪个从官方补）
          mkdir -p out/mods/BaseLib
          for e in dll pck json; do
            [ -f "out/mods/BaseLib/BaseLib.$e" ] || curl -sSL --max-time 180 \
              -o "out/mods/BaseLib/BaseLib.$e" \
              "https://github.com/Alchyr/BaseLib-StS2/releases/download/v3.4.7/BaseLib.$e"
          done

          # 6) 一致性校验 + 打包
          cd out/mods
          for M in Emberkeeper BaseLib; do
            N=$(ls $M/*.pck 2>/dev/null | wc -l)
            H=$(grep -o '"has_pck"[^,}]*' $M/*.json | head -1)
            echo "$M: pck=$N  $H"
          done
          cd .. && zip -r -q Emberkeeper-mod.zip mods
          echo "===== 成品 ====="
          find mods -type f | sort
          ls -lh Emberkeeper-mod.zip
          exit 0

      - name: 上传成品
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Emberkeeper-mod
          path: ${{ env.R }}/out/Emberkeeper-mod.zip
