name: build
on: [push, workflow_dispatch]

# 最终产物是一个「完整安装包」，解压后直接得到两个 mod 文件夹：
#   BaseLib/      （前置库，含 pck）
#   Emberkeeper/  （守烬人本体）
# 把这两个文件夹整个丢进 Slay the Spire 2/mods/ 即可。

jobs:
  b:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: 解压 + 版本校验
        run: |
          mkdir -p s
          echo "=== zip 校验码 ==="
          md5sum Emberkeeper.zip
          unzip -o -q Emberkeeper.zip -d s
          if [ -f s/Emberkeeper/Emberkeeper.csproj ]; then R=s/Emberkeeper
          elif [ -f s/Emberkeeper.csproj ]; then R=s
          else R=$(dirname "$(find s -name 'Emberkeeper.csproj' | head -1)"); fi
          echo "R=$R" >> $GITHUB_ENV
          echo "源码根：$R"
          echo "=== 美术开关 ==="
          grep -n "UseCustomArt = " "$R/Code/Characters/EmberkeeperCharacter.cs"
          echo "=== 贴图数量（应有 12）==="
          find "$R/Emberkeeper/images" -type f | wc -l
          echo "=== 仓库根目录（看你传的 BaseLib 在不在）==="
          ls -la .

      - name: 还原依赖
        run: |
          cd "$R"
          dotnet restore -p:UseRefLib=true 2>&1 | tail -8

      - name: 探测 API 签名
        id: probe
        continue-on-error: true
        run: |
          cd "$R/tools/probe"
          dotnet run -c Release 2>&1 | tail -60

      - name: 编译
        id: build
        continue-on-error: true
        run: |
          cd "$R"
          echo "=== build ===" > /tmp/log.txt
          dotnet build -c Release --no-restore -p:UseRefLib=true >> /tmp/log.txt 2>&1
          echo "build exit=$?" >> /tmp/log.txt
          echo "===== 全部错误 ====="
          grep -E "error" /tmp/log.txt | sort -u | head -60 || echo "(无错误)"

      - name: 导出 PCK
        id: pck
        continue-on-error: true
        run: |
          cd "$R"
          mkdir -p out/mods/Emberkeeper
          DLL=$(find . -name "Emberkeeper.dll" -not -path "*/obj/*" | head -1)
          if [ -n "$DLL" ]; then cp "$DLL" out/mods/Emberkeeper/; cp Emberkeeper.json out/mods/Emberkeeper/; echo "DLL 已产出"; fi

          cd /tmp
          curl -sSL -o g.zip https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux_x86_64.zip
          echo "godot.zip: $(stat -c%s g.zip 2>/dev/null || echo 0) 字节"
          unzip -q -o g.zip
          mv Godot_v4.5.1-stable_linux_x86_64 gb 2>/dev/null || true
          chmod +x gb
          echo "=== Godot 版本 ==="
          ./gb --headless --version 2>&1 | head -3 || echo "(版本打印失败)"

          cd "$R"
          mkdir -p .h
          [ -d Code ] && mv Code .h/Code
          [ -d tools ] && mv tools .h/tools
          [ -f Emberkeeper.csproj ] && mv Emberkeeper.csproj .h/

          echo "=== Godot 导入 ==="
          /tmp/gb --headless --path . --import 2>&1 | tail -30
          echo "=== .godot 缓存 ==="
          ls -la .godot 2>/dev/null | head -8 || echo "(无 .godot)"

          for PRESET in BasicExport CustomExport MinimalExport; do
            echo ""
            echo "########## 尝试预设: $PRESET ##########"
            rm -f Emberkeeper.pck
            /tmp/gb --headless --path . --export-pack "$PRESET" Emberkeeper.pck 2>&1 | tail -40
            if [ -f Emberkeeper.pck ]; then
              echo "✔ 成功：$PRESET"; ls -lh Emberkeeper.pck; break
            else
              echo "✘ 失败：$PRESET"
            fi
          done

          [ -d .h/Code ] && mv .h/Code Code
          [ -d .h/tools ] && mv .h/tools tools
          [ -f .h/Emberkeeper.csproj ] && mv .h/Emberkeeper.csproj Emberkeeper.csproj

          echo ""
          echo "########## PCK 结果 ##########"
          if [ -f Emberkeeper.pck ]; then
            cp Emberkeeper.pck out/mods/Emberkeeper/
            echo "PCK OK → 完整版（自定义贴图）"
          else
            echo "PCK 失败 → 改用原版美术重编译（has_pck=false）"
            sed -i 's/UseCustomArt = true/UseCustomArt = false/' Code/Characters/EmberkeeperCharacter.cs
            dotnet build -c Release --no-restore -p:UseRefLib=true 2>&1 | tail -15
            DLL2=$(find . -name "Emberkeeper.dll" -not -path "*/obj/*" | head -1)
            [ -n "$DLL2" ] && cp "$DLL2" out/mods/Emberkeeper/
            cp Emberkeeper-NoPck.json out/mods/Emberkeeper/Emberkeeper.json
            echo "已回退精简版"
          fi

      # ── 准备 BaseLib（前置库，含 pck）──────────────────────────
      - name: 准备 BaseLib 前置库
        id: baselib
        run: |
          cd "$R"
          mkdir -p out/mods/BaseLib
          BL_ZIP=$(find /home/runner/work -maxdepth 4 -iname "*BaseLib*.zip" 2>/dev/null | grep -v "s/Emberkeeper" | head -1)
          # 若没找到 zip，尝试仓库里的独立文件
          if [ -z "$BL_ZIP" ]; then
            for ext in dll pck json; do
              f=$(find /home/runner/work -maxdepth 4 -iname "BaseLib.$ext" 2>/dev/null | head -1)
              [ -n "$f" ] && cp "$f" out/mods/BaseLib/
            done
          else
            echo "解压仓库里的 BaseLib 压缩包: $BL_ZIP"
            mkdir -p /tmp/blz && unzip -o -q "$BL_ZIP" -d /tmp/blz
            for ext in dll pck json; do
              f=$(find /tmp/blz -iname "BaseLib.$ext" | head -1)
              [ -n "$f" ] && cp "$f" out/mods/BaseLib/
            done
          fi

          # 缺哪个就从官方 release 补
          for ext in dll pck json; do
            if [ ! -f "out/mods/BaseLib/BaseLib.$ext" ]; then
              echo "缺 BaseLib.$ext，从官方 release 下载..."
              curl -sSL -o "out/mods/BaseLib/BaseLib.$ext" \
                "https://github.com/Alchyr/BaseLib-StS2/releases/download/v3.4.7/BaseLib.$ext"
            fi
          done

          echo "=== BaseLib 三件套 ==="
          ls -lh out/mods/BaseLib/

      - name: 成品一致性校验
        run: |
          cd "$R/out/mods"
          echo "=== 完整安装包结构 ==="
          find . -type f | sort
          echo ""
          FAIL=0
          for M in Emberkeeper BaseLib; do
            PCK=$(ls $M/*.pck 2>/dev/null | wc -l)
            HP=$(grep -o '"has_pck"[[:space:]]*:[[:space:]]*[a-z]*' $M/*.json 2>/dev/null | head -1)
            echo "$M: pck文件数=$PCK  清单声明=$HP"
            if [ "$PCK" -eq 0 ] && echo "$HP" | grep -q "true"; then
              echo "::error::$M 清单说有 pck 但文件缺失"; FAIL=1
            fi
          done
          [ $FAIL -eq 0 ] && echo "✓ 两个 mod 都自洽" || exit 1

      - name: 打包完整安装包
        run: |
          cd "$R/out"
          zip -r Emberkeeper-mod.zip mods
          mv Emberkeeper-mod.zip "$R/out/Emberkeeper-mod.zip"
          ls -lh "$R/out/Emberkeeper-mod.zip"

      - name: 写摘要
        if: always()
        run: |
          {
            echo "## 构建结果"
            echo ""
            echo "build：**${{ steps.build.outcome }}** / pck：**${{ steps.pck.outcome }}**"
            echo ""
            echo "下载 Emberkeeper-mod.zip 解压后，把里面的 **BaseLib** 和 **Emberkeeper**"
            echo "两个文件夹一起丢进 Slay the Spire 2/mods/ 即可。"
            echo ""
            echo '```'
            grep -E "error" /tmp/log.txt 2>/dev/null | sort -u | head -40 || echo "(无错误)"
            echo '```'
          } >> $GITHUB_STEP_SUMMARY

      - name: 上传成品
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Emberkeeper-mod
          path: ${{ env.R }}/out/Emberkeeper-mod.zip
